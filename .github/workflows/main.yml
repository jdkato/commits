name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The archive is what users install, so the license and the attribution
      # for the gitmoji list travel inside it.
      - run: cp LICENSE NOTICE Commits/
      - run: zip -r Commits.zip Commits -x "*.DS_Store" "*.test.yml"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Commits.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The rules keep their cases in `tests:` blocks read through the View
      # with a case's `view:` key, which is on Vale's v3 branch until the
      # release that ships it -- built from source until then. Linting needs
      # only v3.21.0.
      - uses: actions/checkout@v4
        with:
          repository: vale-cli/vale
          ref: v3
          path: vale-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: vale-src/go.mod
      - run: |
          go build -o "$RUNNER_TEMP/bin/vale" ./cmd/vale
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
        working-directory: vale-src

      - run: ./test.sh
