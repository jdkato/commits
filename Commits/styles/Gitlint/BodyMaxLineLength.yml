# B1 `body-max-line-length`, `line-length=80`. The script is the shared one,
# Commits/_shared/Wrap.yml, with its margin at 80; a script is one value, so
# a different margin means the whole of it.
extends: Commits._shared.Wrap
message: "B1 body-max-line-length: this line runs past 80 from '%s'."
link: https://jorisroovers.com/gitlint/latest/rules/builtin_rules/#b1-body-max-line-length
level: error
script: |
  max := 80
  text := import("text")
  matches := []
  pos := 0
  seen_subject := false
  para_start := true
  in_trailers := false
  for line in text.split(scope, "\n") {
    next := pos + len(line) + 1
    if text.re_match(`^#\s*-+\s*>8\s*-+\s*$`, line) {
      break
    }
    if text.has_prefix(line, "#") {
      pos = next
      continue
    }
    if text.trim_space(line) == "" {
      para_start = true
      in_trailers = false
      pos = next
      continue
    }
    if !seen_subject {
      seen_subject = true
      pos = next
      continue
    }
    if para_start && text.re_match(`^(?i:breaking[ -]change|[\w-]+)(?:: | #)`, line) {
      in_trailers = true
    }
    para_start = false
    if !in_trailers && !text.re_match(`https?://`, line) {
      over := text.re_find(`^.{` + string(max) + `}`, line)
      if over != undefined && over[0][0].end < len(line) {
        matches = append(matches, {begin: pos + over[0][0].end, end: pos + len(line)})
      }
    }
    pos = next
  }

tests:
  - name: "before"
    about: "gitlint's built-in rules at their defaults, most of them at once"
    format: COMMIT_EDITMSG
    view: Commit
    input: "WIP: a title that runs past seventy-two characters, with a tab\there, and a period.\nThe body starts on the second line, with trailing spaces   \nand a line that is longer than the eighty characters gitlint allows a body line to run.\n"
    want: |
      3:81:Gitlint.BodyMaxLineLength:B1 body-max-line-length: this line runs past 80 from 'to run.'.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add fixed-point parsing to the tokenizer

      Numbers with a decimal point were read as two integers, and the
      second one lost its sign.
    want: ""
  - name: "guards"
    about: "WIPING is a word that contains WIP and passes, as in gitlint"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Stop WIPING the cache on every request

      The cache was cleared by the request handler rather than by the
      scheduler, so it never held anything for long.
    want: ""
