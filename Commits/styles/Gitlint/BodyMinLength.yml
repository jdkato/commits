# B5 `body-min-length`, `min-length=20`, counted over the body's characters.
# `Gitlint.BodyMinLength[min]` sets it.
extends: occurrence
message: "B5 body-min-length: a body of %d characters."
link: https://jorisroovers.com/gitlint/latest/rules/builtin_rules/#b5-body-min-length
level: error
scope: body
token: '.'
min: 20

tests:
  - name: "short"
    about: "a title under five characters, and no body"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Fix
    want: |
      1:1:Gitlint.BodyMinLength:B5 body-min-length: a body of 0 characters.
  - name: "after"
    about: "the rewrite"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Add fixed-point parsing to the tokenizer

      Numbers with a decimal point were read as two integers, and the
      second one lost its sign.
    want: ""
  - name: "guards"
    about: "WIPING is a word that contains WIP and passes, as in gitlint"
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      Stop WIPING the cache on every request

      The cache was cleared by the request handler rather than by the
      scheduler, so it never held anything for long.
    want: ""
