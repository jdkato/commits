# The repository holds its own commits to the convention it ships: the
# commit-msg hook in script/ reads this file, and test.sh checks the message
# at HEAD against it. The first section is the same config the README tells
# you to write, with the package's styles read from the tree instead of a
# sync.
StylesPath = Commits/styles
MinAlertLevel = suggestion

[COMMIT_EDITMSG]
BasedOnStyles = Commits, Conventional
View = Commit

# The rest are for `vale test`, for the Upstream.test.yml files, which hold
# other tools' fixtures and run under a real configuration: a case names a
# style as its `format`, and the section for that name runs it with the
# style on, through the same View. Every other case is embedded in its rule
# and runs in isolation, with `view: Commit` bringing the View along.

[*.Conventional]
BasedOnStyles = Commits, Conventional
View = Commit

[*.Commitlint]
BasedOnStyles = Commits, Conventional, Commitlint
View = Commit
Commitlint.Scope = NO
Commitlint.ScopeRequired = NO
Commitlint.HeaderCase = NO
Commitlint.HeaderMinLength = NO
Commitlint.BodyMinLength = NO
Commitlint.References = NO
Commitlint.Trailer = NO
Commitlint.Exclamation = NO
Commitlint.BreakingBang = NO
Commitlint.Body = NO
Commitlint.BodyMaxLength = NO
Commitlint.FooterRequired = NO
Commitlint.FooterMaxLength = NO
Commitlint.ScopeCase = NO
Commitlint.SubjectLength = NO
Commitlint.ScopeLength = NO
Commitlint.ScopeDelimiter = NO
Commitlint.TypeLength = NO
Commitlint.BodyCase = NO
Commitlint.BodyFullStop = NO

[*.Gitlint]
BasedOnStyles = Commits, Gitlint
View = Commit
Gitlint.DisallowCleanupCommits = NO
Gitlint.TitleMatchRegex = NO
Gitlint.BodyMatchRegex = NO

[*.Committed]
BasedOnStyles = Commits, Committed
View = Commit
Committed.Type = NO
Committed.HardLineLength = NO
Committed.DescriptionCapitalized = NO

[*.Conform]
BasedOnStyles = Commits, Conform
View = Commit
Conform.Jira = NO
Conform.DescriptionLength = NO

[*.Commitizen]
BasedOnStyles = Commits, Conventional, Commitizen
View = Commit
